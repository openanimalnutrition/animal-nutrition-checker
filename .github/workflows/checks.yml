# The automatic checks of every pull request and of main: tools/check.py, the same command
# run locally. On a pull request it also writes the impact report of the change (data/
# against the data of the branch merged into) to the run's summary page.
#
# Written in phase 4 (22 Oct 2026; the contract job in phase 5). First run on GitHub on
# 22 Oct 2026: ubuntu-latest (26.04) has no Python 3.9, so the 3.9 job runs on 24.04, which
# has 3.9.25, the box's version. When 24.04 is retired, 3.9 needs another route or the
# README's "Python 3.9 or later" changes.
# No secrets; the token can only read; a pull request from a fork runs the same way.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The data of the branch merged into
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git archive "origin/$BASE_REF" data | tar -x -C "$RUNNER_TEMP/base"
      - name: All checks
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python -I -B tools/check.py --against "$RUNNER_TEMP/base/data" --summary "$GITHUB_STEP_SUMMARY"
          else
            python -I -B tools/check.py
          fi

  # The GUI and MCP server's contract tests (phase 5), in the test image built from the
  # Dockerfile: the same image the server runs from, with no network.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build --target test -t oan-checker:test .
      - name: Contract tests
        run: docker run --rm --network none --read-only --tmpfs /tmp oan-checker:test
